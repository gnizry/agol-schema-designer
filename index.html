<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעצב פתרונות AGOL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --g9:#2b2a6f; --g8:#4338ca; --g7:#5b5bf0; --g5:#6161ff; --g2:#dcdcff; --g1:#eef0ff; --s9:#1f2145; --s7:#454a6b; --s5:#6b7194; --s4:#9aa0bf; --s3:#d5d9ec; --s2:#e6e9f5; --s1:#f1f3fb; --s0:#f7f8fd; --r:#e2445c; --a:#fdab3d; --ok:#00c875; --rad:16px; --sh:0 1px 2px rgba(31,33,69,.04),0 8px 24px rgba(31,33,69,.07); --ring:0 0 0 3px rgba(97,97,255,.22); }
    * { box-sizing: border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:Heebo,"Segoe UI",Arial,sans-serif; background:linear-gradient(180deg,#eef2f6 0,var(--s0) 220px); color:var(--s9); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { background:linear-gradient(120deg,var(--g9),var(--g8)); color:#fff; padding:12px 22px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(2,44,34,.28); }
    header h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:.2px; }
    header small { color:var(--g2); display:block; font-size:12px; margin-top:2px; font-weight:400; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button, .btn { font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--s3); background:#fff; color:var(--s9); padding:6px 13px; border-radius:9px; transition:background .15s,border-color .15s,box-shadow .15s,transform .05s; }
    button:hover { background:var(--s1); border-color:var(--s4); }
    button:active { transform:translateY(1px); }
    button:focus-visible { outline:none; box-shadow:var(--ring); }
    header button { border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.1); color:#fff; backdrop-filter:blur(4px); }
    header button:hover { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4); }
    header select { background:rgba(255,255,255,.95); }
    button.primary { background:var(--g5); border-color:var(--g5); color:#022c22; font-weight:700; box-shadow:0 1px 2px rgba(5,150,105,.3); }
    button.primary:hover { background:#34d399; border-color:#34d399; }
    header button.danger { color:#fecdd3; }
    button.danger { color:var(--r); }
    button.mini { padding:2px 8px; font-size:11px; border-radius:7px; }
    .layout { display:flex; gap:22px; padding:22px; align-items:flex-start; max-width:1800px; margin:0 auto; }
    nav { width:248px; flex:none; background:#fff; border:1px solid var(--s2); border-radius:var(--rad); padding:10px; position:sticky; top:78px; box-shadow:var(--sh); max-height:calc(100vh - 100px); overflow:auto; }
    nav h4 { margin:14px 8px 6px; font-size:11px; color:var(--s4); text-transform:uppercase; letter-spacing:.8px; font-weight:700; }
    nav h4:first-child { margin-top:6px; }
    nav a { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:8px 10px; border-radius:9px; cursor:pointer; color:var(--s7); transition:background .12s,color .12s; }
    nav a:hover { background:var(--s1); }
    nav a.on { background:var(--g1); color:var(--g8); font-weight:700; box-shadow:inset -3px 0 0 var(--g5); }
    .cnt { background:var(--s1); color:var(--s5); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; }
    nav a.on .cnt { background:var(--g2); color:var(--g9); }
    .cnt.err { background:#fecdd3; color:#9f1239; }
    main { flex:1; min-width:0; }
    main h2, main h3 { letter-spacing:.1px; }
    .card { background:#fff; border:1px solid var(--s2); border-radius:var(--rad); padding:16px; margin-bottom:14px; box-shadow:var(--sh); }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    label { display:block; font-size:12px; color:var(--s5); margin-bottom:4px; font-weight:600; }
    input[type=text], input[type=number], select, textarea { font:inherit; width:100%; border:1px solid var(--s3); border-radius:8px; padding:6px 9px; background:#fff; transition:border-color .15s,box-shadow .15s; }
    input:hover, select:hover, textarea:hover { border-color:var(--s4); }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--g5); box-shadow:var(--ring); }
    .tbl-wrap { overflow-x:auto; background:#fff; border:1px solid var(--s2); border-radius:var(--rad); box-shadow:var(--sh); }
    table { border-collapse:separate; border-spacing:0; width:100%; min-width:1250px; }
    th { background:var(--s0); color:var(--s5); font-size:11px; text-align:right; padding:9px 7px; white-space:nowrap; position:sticky; top:0; font-weight:700; letter-spacing:.3px; border-bottom:1px solid var(--s2); }
    td { padding:4px 5px; border-top:1px solid var(--s1); vertical-align:middle; }
    tbody tr:hover td { background:#f8fafc; }
    td input, td select { font-size:12.5px; padding:4px 7px; border-color:transparent; background:transparent; }
    td input:hover, td select:hover { background:#fff; border-color:var(--s3); }
    td input:focus, td select:focus { background:#fff; }
    td.name input { font-family:"Cascadia Code",Consolas,monospace; font-weight:700; color:var(--g8); background:var(--g1); }
    td.name input { min-width:150px; }
    tr.open td { background:#fffbeb; }
    .mv { display:flex; align-items:center; gap:2px; }
    .mv span { color:var(--s5); width:20px; text-align:center; font-family:monospace; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
    textarea.mono { font-family:"Cascadia Code",Consolas,monospace; font-size:12.5px; line-height:1.55; white-space:pre; }
    pre.code { margin:0; background:var(--s9); color:#e2e8f0; padding:14px; border-radius:0 0 var(--rad) var(--rad); overflow:auto; max-height:70vh; direction:ltr; text-align:left; font-size:12.5px; line-height:1.55; }
    .codehead { background:#020617; color:var(--s4); padding:9px 14px; border-radius:var(--rad) var(--rad) 0 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .tabs { display:flex; gap:6px; margin-bottom:12px; background:var(--s1); padding:4px; border-radius:11px; width:max-content; max-width:100%; flex-wrap:wrap; }
    .tabs button { border-color:transparent; background:transparent; }
    .tabs button:hover { background:#fff; }
    .tabs button.on { background:#fff; color:var(--g8); border-color:var(--s2); font-weight:700; box-shadow:var(--sh); }
    .iss { padding:9px 12px; border-radius:9px; margin-bottom:6px; display:flex; gap:10px; }
    .iss.error { background:#ffe4e6; } .iss.warn { background:#fef3c7; } .iss.info { background:#e0f2fe; }
    .iss b { min-width:140px; font-family:monospace; direction:ltr; text-align:left; }
    .hint { color:var(--s5); font-size:12px; margin:6px 0 0; }
    button, input, select, textarea { font-family:inherit; }
    h3 { font-size:16px; margin:14px 0 8px; } h4 { font-size:14px; margin:12px 0 6px; }
    details > summary { cursor:pointer; }
    ::selection { background:var(--g2); }
    ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--s3); border-radius:8px; border:2px solid transparent; background-clip:padding-box; } ::-webkit-scrollbar-thumb:hover { background:var(--s4); background-clip:padding-box; border:2px solid transparent; }
    #toast { position:fixed; bottom:22px; left:22px; background:var(--s9); color:#fff; padding:11px 18px; border-radius:11px; opacity:0; transform:translateY(8px); transition:opacity .25s,transform .25s; pointer-events:none; z-index:50; box-shadow:0 8px 28px rgba(15,23,42,.35); max-width:420px; }
    #toast.on { opacity:1; transform:none; }

    /* ===== v2: Monday / Make style ===== */
    body { background:#f3f4fb; background-image:radial-gradient(900px 340px at 85% -80px,#e3e4ff 0,transparent 70%),radial-gradient(700px 300px at 0 -60px,#ffe9f3 0,transparent 70%); background-repeat:no-repeat; }
    header { background:rgba(255,255,255,.86); backdrop-filter:saturate(1.4) blur(12px); color:var(--s9); border-bottom:1px solid var(--s2); box-shadow:0 1px 0 rgba(31,33,69,.03); padding:10px 26px; }
    header h1 { font-size:19px; font-weight:800; display:flex; align-items:center; gap:10px; }
    header h1::before { content:""; width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg,#6161ff,#ff5ac4 130%); box-shadow:0 4px 12px rgba(97,97,255,.4); display:inline-block; }
    header small { color:var(--s5); margin-inline-start:40px; margin-top:-2px; }
    header button { background:#fff; color:var(--s9); border-color:var(--s2); backdrop-filter:none; }
    header button:hover { background:var(--s1); border-color:var(--s3); }
    header button.danger { color:var(--r); }
    header select { border-radius:10px; }
    button, .btn { border-radius:999px; padding:7px 16px; font-weight:500; border-color:var(--s2); }
    button.primary { background:var(--g5); border-color:var(--g5); color:#fff; box-shadow:0 4px 12px rgba(97,97,255,.32); font-weight:600; }
    button.primary:hover { background:#4f4fe6; border-color:#4f4fe6; }
    button.mini { border-radius:8px; }
    nav { border:0; border-radius:20px; padding:12px; box-shadow:var(--sh); }
    nav h4 { color:var(--s4); font-size:10.5px; letter-spacing:1.2px; margin:16px 10px 6px; }
    nav a { border-radius:12px; padding:9px 12px; font-weight:500; position:relative; }
    nav a:hover { background:var(--s0); }
    nav a.on { background:linear-gradient(90deg,#eef0ff,#f6f0ff); color:var(--g8); box-shadow:none; font-weight:700; }
    nav a.on::before { content:""; position:absolute; right:-12px; top:9px; bottom:9px; width:4px; border-radius:4px; background:var(--g5); }
    .cnt { background:var(--s1); color:var(--s5); }
    nav a.on .cnt { background:var(--g5); color:#fff; }
    main > h2:first-child, main > h3:first-child { font-size:24px; font-weight:800; letter-spacing:-.3px; margin:4px 0 14px; }
    .card { border:0; border-radius:var(--rad); padding:20px; box-shadow:var(--sh); }
    .tbl-wrap { border:0; border-radius:var(--rad); box-shadow:var(--sh); }
    th { background:#fff; color:var(--s4); text-transform:uppercase; font-size:10.5px; letter-spacing:.8px; padding:12px 8px; border-bottom:2px solid var(--s1); }
    td { border-top:1px solid var(--s1); }
    tbody tr:hover td { background:var(--s0); }
    td.name input { color:var(--g8); background:var(--g1); border-radius:8px; }
    input[type=text], input[type=number], select, textarea { border-radius:10px; border-color:var(--s2); background:#fff; }
    input:focus, select:focus, textarea:focus { border-color:var(--g5); box-shadow:var(--ring); }
    .tabs { background:#fff; box-shadow:var(--sh); border-radius:999px; padding:5px; }
    .tabs button { border-radius:999px; }
    .tabs button.on { background:var(--g5); color:#fff; border-color:var(--g5); box-shadow:0 4px 12px rgba(97,97,255,.3); }
    .iss { border-radius:12px; }
    pre.code { border-radius:0 0 var(--rad) var(--rad); background:#1b1c3a; }
    .codehead { background:#14152e; border-radius:var(--rad) var(--rad) 0 0; }
    ::selection { background:var(--g2); }
    #toast { background:var(--s9); border-radius:14px; }
    .layout { max-width:1880px; padding:26px; gap:26px; }

    /* ===== סימולטור: פריסה ===== */
    .seg { display:inline-flex; background:var(--s1); border-radius:999px; padding:4px; gap:2px; flex-wrap:wrap; }
    .seg button { border:0; background:transparent; border-radius:999px; padding:7px 16px; font-weight:500; color:var(--s7); box-shadow:none; }
    .seg button:hover { background:#fff; }
    .seg button.on { background:#fff; color:var(--g8); font-weight:700; box-shadow:var(--sh); }
    .seg.lg button { padding:9px 20px; font-size:14px; }
    .simtop { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:16px; }
    .simver { margin-inline-start:auto; color:var(--s4); font-size:12px; }
    .simset { position:relative; }
    .simset summary { list-style:none; cursor:pointer; padding:8px 14px; border-radius:999px; background:#fff; border:1px solid var(--s2); font-size:13px; color:var(--s7); }
    .simset[open] summary { border-color:var(--g5); color:var(--g8); }
    .simsetbody { position:absolute; z-index:6; top:42px; inset-inline-start:0; min-width:290px; background:#fff; border-radius:14px; padding:14px; box-shadow:0 12px 36px rgba(31,33,69,.18); display:grid; gap:10px; }
    .simsetbody label { margin:0; font-size:13px; color:var(--s7); font-weight:500; } .simsetbody label.inl { display:flex; gap:8px; align-items:center; }
    .simcard { background:#fff; border-radius:var(--rad); box-shadow:var(--sh); padding:14px 18px; margin-bottom:18px; display:grid; gap:12px; }
    .simrow { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .simlbl { width:84px; flex:none; color:var(--s4); font-size:12px; font-weight:700; }
    .stepper { display:flex; gap:0; align-items:center; flex-wrap:wrap; row-gap:8px; flex:1; }
    .stp { display:flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:999px; background:var(--s1); color:var(--s5); font-size:13px; cursor:pointer; }
    .stp b { width:24px; height:24px; border-radius:50%; background:#fff; color:var(--s5); display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
    .stp.done { background:var(--g1); color:var(--g8); } .stp.done b { background:var(--g5); color:#fff; }
    .stp.on { background:var(--g5); color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(97,97,255,.3); } .stp.on b { background:#fff; color:var(--g5); }
    .stl { width:18px; height:2px; background:var(--s2); display:inline-block; }
    .simgrid { display:grid; grid-template-columns:minmax(330px,400px) minmax(0,1fr); gap:28px; align-items:start; }
    .simphone { position:sticky; top:84px; }
    .simside { background:#fff; border-radius:var(--rad); box-shadow:var(--sh); padding:20px 22px; min-width:0; }
    .simnote { background:var(--g1); border-radius:12px; padding:12px 14px; margin-bottom:12px; line-height:1.6; }
    .simroot table { min-width:0; width:auto; } .simroot th { position:static; text-transform:none; letter-spacing:0; font-size:12px; color:inherit; padding:3px 6px; } .simroot td { padding:3px 6px; }
    @media (max-width: 1000px) { .simgrid { grid-template-columns:1fr; } .simphone { position:static; } }
    @media (max-width: 900px) { .layout { flex-direction:column; padding:12px; } nav { width:100%; position:static; max-height:none; } }
    .menu { position:relative; display:inline-block; }
    #menu-pop { position:absolute; top:calc(100% + 6px); inset-inline-start:0; z-index:40; background:#fff; border:1px solid #E2E8F0; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:6px; display:flex; flex-direction:column; gap:2px; min-width:250px; }
    #menu-pop[hidden] { display:none; }
    #menu-pop button { text-align:start; border:0; background:transparent; width:100%; }
    #menu-pop button:hover { background:#F1F5F9; }
    body.viewonly #proj, body.viewonly #b-folder, body.viewonly #b-resume, body.viewonly #b-save, body.viewonly #b-new, body.viewonly #b-import, body.viewonly #b-export, body.viewonly #b-reset, body.viewonly #b-publish, body.viewonly #b-agol, body.viewonly #b-share { display:none !important; }
    body.viewonly input:disabled, body.viewonly select:disabled, body.viewonly textarea:disabled { background:#F8FAFC; color:#334155; opacity:1; cursor:default; }
    body.simonly nav, body.simonly .btns { display:none; }
    body.simonly .layout { display:block; }
    #fbk { position:fixed; inset-inline-end:16px; bottom:16px; z-index:50; }
    #fbk > button.fab { background:#1E3A8A; color:#fff; border:0; border-radius:999px; padding:12px 18px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25); }
    #fbk .pn { position:absolute; bottom:52px; inset-inline-end:0; width:340px; max-width:90vw; background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); padding:14px; }
    #fbk textarea { width:100%; min-height:80px; box-sizing:border-box; }
    @media print { header, nav { display:none; } body { background:#fff; } .layout { padding:0; } .card { box-shadow:none; } }
  </style>
</head>
<body>
<header>
  <div>
    <h1>מעצב פתרונות AGOL</h1>
    <small id="subtitle"></small>
  </div>
  <div class="btns">
    <select id="proj" style="width:auto;min-width:150px" title="פרויקט"></select>
    <button id="b-folder" hidden>📁 פתח תיקיית פרויקטים</button>
    <button id="b-resume" hidden></button>
    <button id="b-save" class="primary" hidden>💾 שמור לתיקייה</button>
    <button id="b-new">פרויקט חדש…</button>
    <button id="b-import">ייבוא סכמה…</button>
    <div class="menu"><button id="b-menu">📤 ייצוא ושיתוף ▾</button>
      <div id="menu-pop" hidden>
        <button id="b-publish" title="כותב את הסכמה והתמונות לתיקיית האתר; אחרי Push השותפים רואים את כל הכלי בקריאה בלבד בקישור קבוע ומעודכן">🌐 פרסם לשותפים (צפייה בכלי)</button>
        <button id="b-agol" title="יוצר Hosted Feature Layer חדש בארגון ArcGIS Online לפי הסכמה (עם תצוגה מקדימה)">☁ פרסם ל-AGOL…</button>
        <button id="b-doc-word">📄 מסמך אפיון (Word)</button>
        <button id="b-doc-pdf">📕 מסמך אפיון (PDF)</button>
        <label style="display:flex;gap:6px;align-items:center;padding:4px 10px;font-size:12px;color:#475569;cursor:pointer"><input type="checkbox" id="doc-client"> גרסת לקוח: ללא הערות פנימיות</label>
        <button id="b-xlsform" title="יוצר קובץ XLSForm לטופס Survey123 (טופס אחד לכל הרמות), דוח ממצאים וסקריפט פרסום. לא מפרסם">📋 טופס Survey123 (XLSForm)</button>
        <button id="b-share" title="קובץ HTML יחיד עם הסימולטור, לשימוש בלי אינטרנט">🗂 סימולטור כקובץ HTML בודד</button>
      </div></div>
    <button id="b-export" class="primary">ייצוא סכמה (schema.js)</button>
    <button id="b-reset" class="danger">איפוס לגרסת הריפו</button>
    <input type="file" id="file-in" accept=".js,.json" hidden>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="projects/manifest.js"></script>
<script>
/* טוען את קבצי הפרויקטים (לפי manifest) ואחריהם את הקוד — עובד גם בפתיחה ישירה מהדיסק (file://) */
(function () {
  /* ?sim=<key>: סימולטור מפורסם לשותפים (תמיד הקוד העדכני + share/<key>/schema.js) */
  var sim = (new URLSearchParams(location.search).get('sim') || '').replace(/[^A-Za-z0-9_\-]/g, '');
  var files = sim ? ['share/' + sim + '/schema.js'] : (window.PROJECT_FILES || []);
  if (sim) { window.__SIM_ONLY = true; window.__MEDIA_BASE = 'share/' + sim + '/'; }
  /* ?view=<key>: כל הכלי לצפייה בלבד, מהעותק המפורסם share/<key>/schema.js */
  var view = sim ? '' : (new URLSearchParams(location.search).get('view') || '').replace(/[^A-Za-z0-9_\-]/g, '');
  if (view) { files = ['share/' + view + '/schema.js']; window.__VIEW_ONLY = true; window.__MEDIA_BASE = 'share/' + view + '/'; }
  files = files.concat(['js/generators.js', 'js/sim.js', 'js/simgen.js', 'js/diagrams.js', 'js/app.js', 'js/share.js', 'js/specdoc.js', 'js/xlsform.js', 'js/publish.js']);
  (function next(i) {
    if (i >= files.length) return;
    var s = document.createElement('script'); s.src = files[i];
    s.onload = function () { next(i + 1); };
    s.onerror = function () { console.error('לא נטען: ' + files[i]); next(i + 1); };
    document.body.appendChild(s);
  })(0);
})();
</script>
</body>
</html>
