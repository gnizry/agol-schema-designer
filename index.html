<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעצב סכמת AGOL</title>
  <style>
    :root { --g9:#0b3d2e; --g8:#0f5c44; --g7:#047857; --g5:#10b981; --g2:#a7f3d0; --g1:#ecfdf5; --s9:#0f172a; --s7:#334155; --s5:#64748b; --s4:#94a3b8; --s3:#cbd5e1; --s2:#e2e8f0; --s1:#f1f5f9; --s0:#f8fafc; --r:#e11d48; --a:#f59e0b; --rad:12px; --sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06); --ring:0 0 0 3px rgba(16,185,129,.25); }
    * { box-sizing: border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:"Segoe UI Variable Text","Segoe UI",Assistant,system-ui,Arial,sans-serif; background:linear-gradient(180deg,#eef2f6 0,var(--s0) 220px); color:var(--s9); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { background:linear-gradient(120deg,var(--g9),var(--g8)); color:#fff; padding:12px 22px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(2,44,34,.28); }
    header h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:.2px; }
    header small { color:var(--g2); display:block; font-size:12px; margin-top:2px; font-weight:400; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button, .btn { font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--s3); background:#fff; color:var(--s9); padding:6px 13px; border-radius:9px; transition:background .15s,border-color .15s,box-shadow .15s,transform .05s; }
    button:hover { background:var(--s1); border-color:var(--s4); }
    button:active { transform:translateY(1px); }
    button:focus-visible { outline:none; box-shadow:var(--ring); }
    header button { border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.1); color:#fff; backdrop-filter:blur(4px); }
    header button:hover { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4); }
    header select { background:rgba(255,255,255,.95); }
    button.primary { background:var(--g5); border-color:var(--g5); color:#022c22; font-weight:700; box-shadow:0 1px 2px rgba(5,150,105,.3); }
    button.primary:hover { background:#34d399; border-color:#34d399; }
    header button.danger { color:#fecdd3; }
    button.danger { color:var(--r); }
    button.mini { padding:2px 8px; font-size:11px; border-radius:7px; }
    .layout { display:flex; gap:22px; padding:22px; align-items:flex-start; max-width:1800px; margin:0 auto; }
    nav { width:248px; flex:none; background:#fff; border:1px solid var(--s2); border-radius:var(--rad); padding:10px; position:sticky; top:78px; box-shadow:var(--sh); max-height:calc(100vh - 100px); overflow:auto; }
    nav h4 { margin:14px 8px 6px; font-size:11px; color:var(--s4); text-transform:uppercase; letter-spacing:.8px; font-weight:700; }
    nav h4:first-child { margin-top:6px; }
    nav a { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:8px 10px; border-radius:9px; cursor:pointer; color:var(--s7); transition:background .12s,color .12s; }
    nav a:hover { background:var(--s1); }
    nav a.on { background:var(--g1); color:var(--g8); font-weight:700; box-shadow:inset -3px 0 0 var(--g5); }
    .cnt { background:var(--s1); color:var(--s5); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; }
    nav a.on .cnt { background:var(--g2); color:var(--g9); }
    .cnt.err { background:#fecdd3; color:#9f1239; }
    main { flex:1; min-width:0; }
    main h2, main h3 { letter-spacing:.1px; }
    .card { background:#fff; border:1px solid var(--s2); border-radius:var(--rad); padding:16px; margin-bottom:14px; box-shadow:var(--sh); }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    label { display:block; font-size:12px; color:var(--s5); margin-bottom:4px; font-weight:600; }
    input[type=text], input[type=number], select, textarea { font:inherit; width:100%; border:1px solid var(--s3); border-radius:8px; padding:6px 9px; background:#fff; transition:border-color .15s,box-shadow .15s; }
    input:hover, select:hover, textarea:hover { border-color:var(--s4); }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--g5); box-shadow:var(--ring); }
    .tbl-wrap { overflow-x:auto; background:#fff; border:1px solid var(--s2); border-radius:var(--rad); box-shadow:var(--sh); }
    table { border-collapse:separate; border-spacing:0; width:100%; min-width:1250px; }
    th { background:var(--s0); color:var(--s5); font-size:11px; text-align:right; padding:9px 7px; white-space:nowrap; position:sticky; top:0; font-weight:700; letter-spacing:.3px; border-bottom:1px solid var(--s2); }
    td { padding:4px 5px; border-top:1px solid var(--s1); vertical-align:middle; }
    tbody tr:hover td { background:#f8fafc; }
    td input, td select { font-size:12.5px; padding:4px 7px; border-color:transparent; background:transparent; }
    td input:hover, td select:hover { background:#fff; border-color:var(--s3); }
    td input:focus, td select:focus { background:#fff; }
    td.name input { font-family:"Cascadia Code",Consolas,monospace; font-weight:700; color:var(--g8); background:var(--g1); }
    td.name input { min-width:150px; }
    tr.open td { background:#fffbeb; }
    .mv { display:flex; align-items:center; gap:2px; }
    .mv span { color:var(--s5); width:20px; text-align:center; font-family:monospace; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
    textarea.mono { font-family:"Cascadia Code",Consolas,monospace; font-size:12.5px; line-height:1.55; white-space:pre; }
    pre.code { margin:0; background:var(--s9); color:#e2e8f0; padding:14px; border-radius:0 0 var(--rad) var(--rad); overflow:auto; max-height:70vh; direction:ltr; text-align:left; font-size:12.5px; line-height:1.55; }
    .codehead { background:#020617; color:var(--s4); padding:9px 14px; border-radius:var(--rad) var(--rad) 0 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .tabs { display:flex; gap:6px; margin-bottom:12px; background:var(--s1); padding:4px; border-radius:11px; width:max-content; max-width:100%; flex-wrap:wrap; }
    .tabs button { border-color:transparent; background:transparent; }
    .tabs button:hover { background:#fff; }
    .tabs button.on { background:#fff; color:var(--g8); border-color:var(--s2); font-weight:700; box-shadow:var(--sh); }
    .iss { padding:9px 12px; border-radius:9px; margin-bottom:6px; display:flex; gap:10px; }
    .iss.error { background:#ffe4e6; } .iss.warn { background:#fef3c7; } .iss.info { background:#e0f2fe; }
    .iss b { min-width:140px; font-family:monospace; direction:ltr; text-align:left; }
    .hint { color:var(--s5); font-size:12px; margin:6px 0 0; }
    h3 { font-size:16px; margin:14px 0 8px; } h4 { font-size:14px; margin:12px 0 6px; }
    details > summary { cursor:pointer; }
    ::selection { background:var(--g2); }
    ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--s3); border-radius:8px; border:2px solid transparent; background-clip:padding-box; } ::-webkit-scrollbar-thumb:hover { background:var(--s4); background-clip:padding-box; border:2px solid transparent; }
    #toast { position:fixed; bottom:22px; left:22px; background:var(--s9); color:#fff; padding:11px 18px; border-radius:11px; opacity:0; transform:translateY(8px); transition:opacity .25s,transform .25s; pointer-events:none; z-index:50; box-shadow:0 8px 28px rgba(15,23,42,.35); max-width:420px; }
    #toast.on { opacity:1; transform:none; }
    @media (max-width: 900px) { .layout { flex-direction:column; padding:12px; } nav { width:100%; position:static; max-height:none; } }
    @media print { header, nav { display:none; } body { background:#fff; } .layout { padding:0; } .card { box-shadow:none; } }
  </style>
</head>
<body>
<header>
  <div>
    <h1>מעצב סכמת AGOL</h1>
    <small id="subtitle"></small>
  </div>
  <div class="btns">
    <select id="proj" style="width:auto;min-width:150px" title="פרויקט"></select>
    <button id="b-folder" hidden>📁 פתח תיקיית פרויקטים</button>
    <button id="b-resume" hidden></button>
    <button id="b-save" class="primary" hidden>💾 שמור לתיקייה</button>
    <button id="b-new">פרויקט חדש…</button>
    <button id="b-import">ייבוא סכמה…</button>
    <button id="b-export" class="primary">ייצוא סכמה (schema.js)</button>
    <button id="b-reset" class="danger">איפוס לגרסת הריפו</button>
    <input type="file" id="file-in" accept=".js,.json" hidden>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="projects/manifest.js"></script>
<script>
/* טוען את קבצי הפרויקטים (לפי manifest) ואחריהם את הקוד — עובד גם בפתיחה ישירה מהדיסק (file://) */
(function () {
  var files = (window.PROJECT_FILES || []).concat(['js/generators.js', 'js/sim.js', 'js/diagrams.js', 'js/app.js']);
  (function next(i) {
    if (i >= files.length) return;
    var s = document.createElement('script'); s.src = files[i];
    s.onload = function () { next(i + 1); };
    s.onerror = function () { console.error('לא נטען: ' + files[i]); next(i + 1); };
    document.body.appendChild(s);
  })(0);
})();
</script>
</body>
</html>
