<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעצב סכמת AGOL</title>
  <style>
    :root { --g9:#064e3b; --g7:#047857; --g5:#10b981; --g1:#d1fae5; --s9:#0f172a; --s7:#334155; --s5:#64748b; --s3:#cbd5e1; --s2:#e2e8f0; --s1:#f1f5f9; --r:#e11d48; --a:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", Assistant, Arial, sans-serif; background:var(--s1); color:var(--s9); font-size:13px; }
    header { background:var(--g9); color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
    header h1 { margin:0; font-size:17px; }
    header small { color:#a7f3d0; display:block; font-size:11px; margin-top:2px; }
    .btns { display:flex; gap:6px; flex-wrap:wrap; }
    button, .btn { font:inherit; cursor:pointer; border:1px solid var(--s3); background:#fff; color:var(--s9); padding:5px 10px; border-radius:6px; }
    button:hover { background:var(--s1); }
    button.primary { background:var(--g5); border-color:var(--g5); color:#022c22; font-weight:700; }
    button.danger { color:var(--r); }
    button.mini { padding:1px 6px; font-size:11px; }
    .layout { display:flex; gap:14px; padding:14px; align-items:flex-start; }
    nav { width:230px; flex:none; background:#fff; border:1px solid var(--s2); border-radius:10px; padding:8px; position:sticky; top:62px; }
    nav h4 { margin:10px 6px 4px; font-size:11px; color:var(--s5); text-transform:uppercase; }
    nav a { display:flex; justify-content:space-between; gap:6px; padding:6px 8px; border-radius:6px; cursor:pointer; color:var(--s7); }
    nav a:hover { background:var(--s1); }
    nav a.on { background:var(--g1); color:var(--g9); font-weight:700; }
    .cnt { background:var(--s2); border-radius:9px; padding:0 7px; font-size:11px; }
    .cnt.err { background:#fecdd3; color:#9f1239; }
    main { flex:1; min-width:0; }
    .card { background:#fff; border:1px solid var(--s2); border-radius:10px; padding:12px; margin-bottom:12px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    label { display:block; font-size:11px; color:var(--s5); margin-bottom:2px; }
    input[type=text], input[type=number], select, textarea { font:inherit; width:100%; border:1px solid var(--s3); border-radius:5px; padding:4px 6px; background:#fff; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--g5); border-color:var(--g5); }
    .tbl-wrap { overflow-x:auto; background:#fff; border:1px solid var(--s2); border-radius:10px; }
    table { border-collapse:collapse; width:100%; min-width:1250px; }
    th { background:var(--s1); color:var(--s5); font-size:11px; text-align:right; padding:6px; white-space:nowrap; }
    td { padding:3px 4px; border-top:1px solid var(--s2); vertical-align:middle; }
    td input, td select { font-size:12px; }
    td.name input { font-family: Consolas, monospace; font-weight:700; color:var(--g9); background:#ecfdf5; }
    tr.open td { background:#fffbeb; }
    .mv { display:flex; align-items:center; gap:2px; }
    .mv span { color:var(--s5); width:20px; text-align:center; font-family:monospace; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
    textarea.mono { font-family: Consolas, monospace; font-size:12px; line-height:1.5; white-space:pre; }
    pre.code { margin:0; background:var(--s9); color:#e2e8f0; padding:12px; border-radius:0 0 10px 10px; overflow:auto; max-height:70vh; direction:ltr; text-align:left; font-size:12px; line-height:1.5; }
    .codehead { background:#020617; color:#94a3b8; padding:8px 12px; border-radius:10px 10px 0 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .tabs { display:flex; gap:6px; margin-bottom:10px; }
    .tabs button.on { background:var(--g7); color:#fff; border-color:var(--g7); }
    .iss { padding:6px 10px; border-radius:6px; margin-bottom:5px; display:flex; gap:8px; }
    .iss.error { background:#ffe4e6; } .iss.warn { background:#fef3c7; } .iss.info { background:#e0f2fe; }
    .iss b { min-width:140px; font-family:monospace; direction:ltr; text-align:left; }
    .hint { color:var(--s5); font-size:11px; margin:4px 0 0; }
    #toast { position:fixed; bottom:18px; left:18px; background:var(--s9); color:#fff; padding:9px 14px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; }
    #toast.on { opacity:1; }
    @media (max-width: 900px) { .layout { flex-direction:column; } nav { width:100%; position:static; } }
  </style>
</head>
<body>
<header>
  <div>
    <h1>מעצב סכמת AGOL</h1>
    <small id="subtitle"></small>
  </div>
  <div class="btns">
    <select id="proj" style="width:auto;min-width:150px" title="פרויקט"></select>
    <button id="b-folder" hidden>📁 פתח תיקיית פרויקטים</button>
    <button id="b-resume" hidden></button>
    <button id="b-save" class="primary" hidden>💾 שמור לתיקייה</button>
    <button id="b-new">פרויקט חדש…</button>
    <button id="b-import">ייבוא סכמה…</button>
    <button id="b-export" class="primary">ייצוא סכמה (schema.js)</button>
    <button id="b-reset" class="danger">איפוס לגרסת הריפו</button>
    <input type="file" id="file-in" accept=".js,.json" hidden>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="projects/manifest.js"></script>
<script>
/* טוען את קבצי הפרויקטים (לפי manifest) ואחריהם את הקוד — עובד גם בפתיחה ישירה מהדיסק (file://) */
(function () {
  var files = (window.PROJECT_FILES || []).concat(['js/generators.js', 'js/app.js']);
  (function next(i) {
    if (i >= files.length) return;
    var s = document.createElement('script'); s.src = files[i];
    s.onload = function () { next(i + 1); };
    s.onerror = function () { console.error('לא נטען: ' + files[i]); next(i + 1); };
    document.body.appendChild(s);
  })(0);
})();
</script>
</body>
</html>
